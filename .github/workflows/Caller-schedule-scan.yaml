name: Scheduled Security Scans

on:
  schedule:
    # Every weekend (Fri, Sat, Sun) at 11:49 PM IST (18:19 UTC)
  - cron: '51 18 * * 5'

permissions:
  contents: read
  pull-requests: write

jobs:

  # ---------------- Schedule Scan ----------------
  call-central:
    name: Scheduled Security SAST Scan
    uses: snapmint/security-scan-workflows/.github/workflows/security-sast-scan-nightly.yaml@main
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.ref }}
    secrets: inherit